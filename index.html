<body>
  <nav>
    <aside id="nav_one">
      <div id="logo">

            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"

            <path

        <div id="btn_container">
          <button id="shop_btn">Shop Now <i class="fa-solid fa-arrow-right"></i></button>
          <button id="explore_btn">Explore Collections</button>
        </div>
      </aside>
      <aside id="header_two">
        <img src="./assets/heroBackground.png" alt="bag">
      </aside>
    </header>

      <p>194 products found</p>

    <div id="category_btns">

    </div>

  <footer>
    <p>&copy; 2026 Lumen. Crafted with care.</p>
    <p>Free shipping on orders over $50 · 30-day returns</p>
